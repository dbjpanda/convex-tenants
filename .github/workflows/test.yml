name: Test and lint
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6

      - name: Node setup
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          cache-dependency-path: package.json
          node-version: "24.x"
          cache: "npm"

      - name: Install and build
        run: |
          # Replace local file: refs to @djpanda/convex-authz with the published npm version.
          # The file:../authz path only resolves inside the monorepo workspace.
          node -e "
            const fs = require('fs');
            function fixAuthzRef(file, key) {
              const p = JSON.parse(fs.readFileSync(file, 'utf8'));
              if (p[key]?.['@djpanda/convex-authz']?.startsWith('file:')) {
                p[key]['@djpanda/convex-authz'] = '^2.1.1';
                fs.writeFileSync(file, JSON.stringify(p, null, 2) + '\n');
              }
            }
            fixAuthzRef('package.json', 'devDependencies');
            fixAuthzRef('example/package.json', 'dependencies');
          "
          npm i
          cd example && npm i && cd ..
          npm run build
      - name: Publish package for testing branch
        run: npx pkg-pr-new publish || echo "Have you set up pkg-pr-new for this repo?"
      - name: Test
        run: |
          npm run test
          npm run typecheck
          npm run lint
